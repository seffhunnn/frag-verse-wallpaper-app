name: Bug Report
description: Report a bug or unexpected behavior in FragVerse
title: "[BUG]: "
labels: ["bug"]

body:
  - type: input
    attributes:
      label: Short Summary
      placeholder: Briefly describe the issue...
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Difficulty
      options:
        - Easy
        - Medium
        - Hard
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      options:
        - UI
        - Performance
        - Masonry
        - Pagination
        - Frontend
        - Backend
        - Supabase
        - Firebase
        - Cloudinary
        - Unsplash

  - type: textarea
    attributes:
      label: Full Details
      description: Include reproduction steps, expected behavior, screenshots, or any additional context.
      placeholder: |
        Describe the issue in detail...

        Steps to reproduce:
        1.
        2.
        3.
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I verified this issue does not already exist.
          required: true
