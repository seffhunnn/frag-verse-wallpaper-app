name: Bug Report
description: Report a bug or unexpected behavior in FragVerse
title: "[BUG]: "
labels: ["bug"]

body:
  - type: input
    attributes:
      label: Bug Summary
      placeholder: Briefly describe the issue...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe issue...
    validations:
      required: true

  - type: input
    attributes:
      label: Expected Behavior
      placeholder: What should happen instead?

  - type: dropdown
    attributes:
      label: Difficulty
      options:
        - Easy
        - Medium
        - Hard
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      options:
        - UI
        - Performance
        - Masonry
        - Pagination
        - Frontend
        - Backend
        - Supabase
        - Firebase
        - Cloudinary
        - Unsplash

  - type: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I verified this issue does not already exist.
          required: true
