name: Feature Request
description: Suggest a feature or improvement for FragVerse
title: "[FEATURE]: "
labels: ["enhancement"]

body:
  - type: input
    attributes:
      label: Feature Title
      placeholder: Brief feature title...
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Difficulty
      options:
        - Easy
        - Medium
        - Hard
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area
      options:
        - UI
        - Performance
        - Masonry
        - Pagination
        - Frontend
        - Backend
        - Supabase
        - Firebase
        - Cloudinary
        - Unsplash

  - type: textarea
    attributes:
      label: Description
      description: Explain the feature, motivation, screenshots, or implementation ideas.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I verified this feature request does not already exist.
          required: true
