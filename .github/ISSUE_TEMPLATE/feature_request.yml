name: Feature Request
description: Suggest a new feature or enhancement for FragVerse
title: "[FEATURE]: "
labels: ["enhancement"]

body:
  - type: textarea
    attributes:
      label: Feature Summary
      description: Briefly describe the feature idea.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem / Motivation
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe how you imagine the feature working.

  - type: textarea
    attributes:
      label: Additional Context
      description: Add references or screenshots if applicable.

  - type: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I verified this feature request does not already exist.
          required: true
